name: Build for Windows ARM64

on:
  push:

jobs:
  build-windows-arm64:
    name: Build
    runs-on: ubuntu-latest
    env:
      llvm_path: "${{ github.workspace }}/llvm-mingw"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y \
            gcc git cmake ninja-build pkg-config p7zip libtool make colormake gettext automake autoconf autogen autopoint patch meson ninja-build autoconf-archive
          sudo sed -i 's#-L\* | -R\* | -l\*#-L\* | -R\* | -l\* | */libclang_rt.*.a#g' /usr/share/aclocal/libtool.m4
          wget https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-*.tar.xz
          rm llvm-mingw-*.tar.xz
          mv llvm-mingw-* llvm-mingw

      - name: Setup a new (or from cache) vcpkg (and does not build any package)
        uses: lukka/run-vcpkg@v11 # Always specify the specific _version_ of the
                                  # action you need, `v11` in this case to stay up
                                  # to date with fixes on the v11 branch
        with:
          vcpkgGitCommitId: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
          
      - name: Install libraries from vcpkg
        run: |
          export PATH=${{ env.llvm_path }}/bin:$PATH
          cd ${{ env.RUNVCPKG_VCPKG_ROOT }}
          sed -i 's/OPTIONS/OPTIONS\n--disable-hardware-acceleration/g' ports/libgnutls/portfile.cmake
          # tell vcpkg to only build Release variants of the dependencies
          mkdir triplets_overlay
          cp triplets/community/arm64-mingw-dynamic.cmake triplets_overlay/arm64-mingw-dynamic-release.cmake
          echo "set(VCPKG_BUILD_TYPE release)" >> triplets_overlay/arm64-mingw-dynamic-release.cmake
          # clear buildtrees after each package installation to reduce disk space requirements
          packages="sqlite3 argon2 zlib"
          ./vcpkg upgrade \
            --overlay-triplets=triplets_overlay \
            --no-dry-run
          ./vcpkg install \
            --overlay-triplets=triplets_overlay \
            --clean-after-build \
            --triplet=arm64-mingw-dynamic-release \
            $packages
          cd ${{ github.workspace }}/vcpkg/installed/arm64-mingw-dynamic-release/lib

      - name: Build filezilla
        run: |
          chmod 755 build.sh
          ./build.sh arm64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filezilla_arm64
          path: |
            ./FileZilla*.zip

      - name: Batch release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ./FileZilla*.zip
